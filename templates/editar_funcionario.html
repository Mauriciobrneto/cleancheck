{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h3 class="page-title">
            Editar Funcionário
        </h3>

        <div class="page-subtitle">
            Atualize os dados do funcionário
        </div>
    </div>

    <a href="{{ url_for('funcionarios') }}"
       class="btn btn-outline-secondary btn-sm">

        Voltar

    </a>

</div>

<div class="card shadow-sm border-0">

    <div class="card-header bg-white">
        Dados do funcionário
    </div>

    <div class="card-body">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">

                <label class="form-label">
                    Nome
                </label>

                <input
                    type="text"
                    name="nome"
                    class="form-control"
                    value="{{ funcionario.nome }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Usuário
                </label>

                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                    value="{{ funcionario.usuario }}"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ funcionario.email }}"
                    required
                >

            </div>

            <button type="submit" class="btn btn-success">
                Salvar alterações
            </button>

        </form>

    </div>

</div>

{% endblock %}
