<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CleanCheck</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow-lg border-0 cc-card-hover" style="width: 100%; max-width: 420px;">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <div class="bg-success text-white rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center"
                     style="width: 64px; height: 64px; font-size: 28px;">
                    ✓
                </div>

                <h2 class="fw-bold text-success mb-1">
                    CleanCheck
                </h2>

                <p class="text-muted mb-0">
                    Controle diário de limpeza
                </p>

            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert alert-{{ category }} py-2">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label class="form-label">
                        Usuário
                    </label>

                    <input
                        type="text"
                        name="usuario"
                        class="form-control"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="senha"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button type="submit" class="btn btn-success w-100">
                    Entrar
                </button>

            </form>

        </div>

        <div class="card-footer text-center bg-white border-0 pb-4">

            <small class="text-muted">
                CleanCheck © Sistema de controle de limpeza
            </small>

        </div>

    </div>

</div>

</body>
</html>
