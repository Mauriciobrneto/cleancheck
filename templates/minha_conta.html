{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h3 class="page-title">
            Minha Conta
        </h3>

        <div class="page-subtitle">
            Gerencie suas informações de acesso
        </div>
    </div>

    <a href="{{ url_for('dashboard') }}"
       class="btn btn-outline-secondary btn-sm">

        Voltar

    </a>

</div>

<div class="card shadow-sm border-0">

    <div class="card-header bg-white">
        Alterar senha
    </div>

    <div class="card-body">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">

                <label class="form-label">
                    Usuário
                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ current_user.usuario }}"
                    disabled
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Senha atual
                </label>

                <input
                    type="password"
                    name="senha_atual"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Nova senha
                </label>

                <input
                    type="password"
                    name="nova_senha"
                    class="form-control"
                    required
                >

            </div>

            <button type="submit"
                    class="btn btn-success">

                Alterar senha

            </button>

        </form>

    </div>

</div>

{% endblock %}
