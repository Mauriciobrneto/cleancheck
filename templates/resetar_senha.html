{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h3 class="page-title">
            Resetar Senha
        </h3>

        <div class="page-subtitle">
            Defina uma nova senha para o funcionário
        </div>
    </div>

    <a href="{{ url_for('funcionarios') }}"
       class="btn btn-outline-secondary btn-sm">

        Voltar

    </a>

</div>

<div class="card shadow-sm border-0">

    <div class="card-header bg-white fw-bold">
        Nova senha
    </div>

    <div class="card-body">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">

                <label class="form-label">
                    Funcionário
                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ funcionario.nome }}"
                    disabled
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Nova senha
                </label>

                <input
                    type="password"
                    name="senha"
                    class="form-control"
                    required
                >

            </div>

            <button type="submit"
                    class="btn btn-warning">

                Resetar senha

            </button>

        </form>

    </div>

</div>

{% endblock %}
